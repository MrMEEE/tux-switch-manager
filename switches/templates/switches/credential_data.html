<table><thead><tr><th>Name</th><th>Username</th><th>Action</th></tr></thead><tbody>
{% for credential in credentials %}<tr><td>{{ credential.name }}</td><td>{{ credential.username }}</td><td><a href="{% url 'credential-edit' credential.pk %}">Edit</a></td></tr>{% empty %}<tr><td colspan="3">No credentials yet. Create one to assign to switches or verify discovery candidates.</td></tr>{% endfor %}
</tbody></table>
